server:
  port: ${PORT:8089}
  shutdown: graceful

spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
  jackson:
    default-property-inclusion: non_null

  # PostgreSQL: runtime role is not the table owner, so row-level security applies
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USER:notification_app}
    password: ${DB_PASSWORD:notification_app}
    hikari:
      maximum-pool-size: 10
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    user: ${DB_OWNER_USER:notification_owner}
    password: ${DB_OWNER_PASSWORD:notification_owner}
    locations: classpath:db/platform,classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

  # Kafka: CloudEvents JSON as strings; offsets committed after the DB commit
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

  # E-mail channel: Mailpit (infra/docker, port 1025) locally
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  cloud:
    config:
      fail-fast: false
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    configs:
      default:
        timeout-duration: 6s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    correlation: "[%X{traceId:-}] [%X{societyId:-}] "

sos:
  default-timezone: Asia/Kolkata
  outbox:
    # debezium (Kafka Connect reads the WAL) or polling (built-in relay, no Connect needed)
    relay: ${SOS_OUTBOX_RELAY:debezium}
  security:
    issuer: ${SOS_ISSUER:https://auth.societyos.in}
    jwks-uri: ${SOS_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    public-paths: []
  crypto:
    # DEVELOPMENT KEYS ONLY. Staging/prod inject KMS-backed keys through Secrets Manager.
    field-key: ${SOS_FIELD_KEY:c29jaWV0eW9zLWxvY2FsLWRldi1maWVsZC1rZXktMzI=}
    hash-key: ${SOS_HASH_KEY:c29jaWV0eW9zLWxvY2FsLWRldi1oYXNoLWtleQ==}
  notification:
    # Client-credentials service token (identity-service) for recipient contact lookups.
    identity-url: ${IDENTITY_URL:http://localhost:8081}
    client-id: ${SOS_NOTIFICATION_CLIENT_ID:notification-service}
    # Local development secret only; staging/prod inject it from Secrets Manager.
    client-secret: ${SOS_NOTIFICATION_CLIENT_SECRET:notification-local-dev-secret}
    dispatch-poll: ${SOS_NOTIFICATION_DISPATCH_POLL:2s}
    retention-cron: "0 15 3 * * *"
    retry:
      max-attempts: 5
      initial-backoff: 30s
      max-backoff: 30m
    email:
      from: ${SOS_NOTIFICATION_EMAIL_FROM:no-reply@societyos.in}
    # Adapters: logging stubs by default; switch to real providers per environment.
    channels:
      push: ${SOS_PUSH_PROVIDER:log}        # log | fcm
      sms: ${SOS_SMS_PROVIDER:log}          # log | msg91
      whatsapp: ${SOS_WHATSAPP_PROVIDER:log} # log | gupshup
      email: ${SOS_EMAIL_PROVIDER:smtp}     # smtp | log
