server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 15s
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
          routes:
            # Service-only endpoints (/v1/internal/**) are never reachable from outside
            - id: block-internal
              uri: no://op
              order: -100
              predicates:
                - Path=/api/*/v1/internal/**
              filters:
                - SetStatus=404
            - id: identity-otp
              uri: lb://identity-service
              order: -10
              predicates:
                - Path=/api/identity/v1/auth/otp/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"
                    deny-empty-key: true
                - name: CircuitBreaker
                  args:
                    name: identity
                    fallbackUri: forward:/fallback/identity-service
            - id: jwks
              uri: lb://identity-service
              predicates:
                - Path=/.well-known/jwks.json
            - id: realtime-ws
              uri: lb:ws://realtime-service
              predicates:
                - Path=/ws/**
            - id: identity
              uri: lb://identity-service
              predicates:
                - Path=/api/identity/**
              filters:
                - StripPrefix=2
                - name: CircuitBreaker
                  args:
                    name: identity
                    fallbackUri: forward:/fallback/identity-service
            - id: society
              uri: lb://society-service
              predicates:
                - Path=/api/society/**
              filters:
                - StripPrefix=2
                - name: CircuitBreaker
                  args:
                    name: society
                    fallbackUri: forward:/fallback/society-service
            - id: security
              uri: lb://security-service
              predicates:
                - Path=/api/security/**
              filters:
                - StripPrefix=2
                - name: CircuitBreaker
                  args:
                    name: security
                    fallbackUri: forward:/fallback/security-service
            - id: billing
