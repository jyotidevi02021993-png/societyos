                    fallbackUri: forward:/fallback/marketplace-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

# Paths reachable without a token; everything else needs a valid JWT
sos:
  gateway:
    issuer: ${SOS_ISSUER:https://auth.societyos.in}
    jwks-uri: ${SOS_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    public-paths:
      - /api/identity/v1/auth/**
      - /.well-known/jwks.json
      - /api/billing/v1/webhooks/**
      - /api/security/v1/public/**
      - /ws/**
    allowed-origins:
      - ${ADMIN_WEB_ORIGIN:http://localhost:3000}
      - ${RESIDENT_WEB_ORIGIN:http://localhost:3001}

# Default Resilience4j settings for every route's circuit breaker
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  timelimiter:
    configs:
      default:
        timeout-duration: 15s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
