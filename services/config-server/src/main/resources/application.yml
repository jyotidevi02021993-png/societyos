server:
  port: ${PORT:8888}

spring:
  application:
    name: config-server
  profiles:
    # "native" reads a folder (local dev); set CONFIG_BACKEND=git with CONFIG_GIT_URI in staging/prod
    active: ${CONFIG_BACKEND:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO:file:../../config-repo/}
        git:
          uri: ${CONFIG_GIT_URI:}
          default-label: main
          clone-on-start: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
