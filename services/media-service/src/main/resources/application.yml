server:
  port: ${PORT:8091}
  shutdown: graceful

spring:
  application:
    name: media-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
  jackson:
    default-property-inclusion: non_null

  # PostgreSQL: runtime role is not the table owner, so row-level security applies
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/media_db}
    username: ${DB_USER:media_app}
    password: ${DB_PASSWORD:media_app}
    hikari:
      maximum-pool-size: 10
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/media_db}
    user: ${DB_OWNER_USER:media_owner}
    password: ${DB_OWNER_PASSWORD:media_owner}
    locations: classpath:db/platform,classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

  # Kafka: CloudEvents JSON as strings; offsets committed after the DB commit
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  cloud:
    config:
      fail-fast: false
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    configs:
      default:
        timeout-duration: 6s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    correlation: "[%X{traceId:-}] [%X{societyId:-}] "

sos:
  default-timezone: Asia/Kolkata
  media:
    # Local: MinIO from infra/docker (profile object-storage). AWS: leave endpoint empty, IRSA credentials.
    bucket: ${SOS_MEDIA_BUCKET:societyos-media}
    endpoint: ${SOS_MEDIA_S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${SOS_MEDIA_S3_PUBLIC_ENDPOINT:}
    region: ${SOS_MEDIA_S3_REGION:ap-south-1}
    access-key: ${SOS_MEDIA_S3_ACCESS_KEY:societyos}
    secret-key: ${SOS_MEDIA_S3_SECRET_KEY:societyos-secret}
    path-style: true
    create-bucket: ${SOS_MEDIA_CREATE_BUCKET:true}
    upload-ttl: 15m                     # presigned PUT lifetime
    download-ttl: 5m                    # presigned GET lifetime
    process-poll: 5s                    # db-scheduler: scan + thumbnail of uploaded files
    retention-cron: "0 45 2 * * *"      # nightly purge, in sos.default-timezone
    thumbnail-edge: 320
  scheduler:
    enabled: true
  outbox:
    # debezium (Kafka Connect reads the WAL) or polling (built-in relay, no Connect needed)
    relay: ${SOS_OUTBOX_RELAY:debezium}
  security:
    issuer: ${SOS_ISSUER:https://auth.societyos.in}
    jwks-uri: ${SOS_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    public-paths: []
  crypto:
    # DEVELOPMENT KEYS ONLY. Staging/prod inject KMS-backed keys through Secrets Manager.
    field-key: ${SOS_FIELD_KEY:c29jaWV0eW9zLWxvY2FsLWRldi1maWVsZC1rZXktMzI=}
    hash-key: ${SOS_HASH_KEY:c29jaWV0eW9zLWxvY2FsLWRldi1oYXNoLWtleQ==}
